name: Build and offline regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
      - name: Cross compile monitor and Linux helpers
        run: make CROSS_COMPILE=riscv64-linux-gnu-
      - name: Host rendering, JSON, counters and PID
        run: make test
